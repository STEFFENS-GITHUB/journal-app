apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: karpenter-nodepool
    spec:
      project: default
      source:
        repoURL: {{ .Values.karpenterNodePool.repoURL }}
        targetRevision: {{ .Values.karpenterNodePool.targetRevision }}
        path: {{ .Values.karpenterNodePool.path }}
        helm:
          valuesObject:
            clusterName: '{{`{{.metadata.annotations.cluster_name}}`}}'
            nodeRole: '{{`{{.metadata.annotations.node_role}}`}}'
      destination:
        name: '{{`{{.name}}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
        retry:
          limit: -1
