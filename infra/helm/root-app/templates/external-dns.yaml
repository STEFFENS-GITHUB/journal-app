apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: external-dns
    spec:
      project: default
      source:
        repoURL: {{ .Values.externalDns.repoURL }}
        chart: {{ .Values.externalDns.chart }}
        targetRevision: {{ .Values.externalDns.version }}
        helm:
          releaseName: external-dns
          valuesObject:
            provider:
              name: aws
            env:
              - name: AWS_DEFAULT_REGION
                value: '{{`{{.metadata.annotations.region}}`}}'
            domainFilters:
              - '{{`{{.metadata.annotations.domain}}`}}'
            txtOwnerId: '{{`{{.metadata.annotations.cluster_name}}`}}'
            policy: sync
            serviceAccount:
              name: external-dns
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            nodeSelector:
              {{- toYaml .Values.control.nodeSelector | nindent 14 }}
            tolerations:
              {{- toYaml .Values.control.tolerations | nindent 14 }}
      destination:
        name: '{{`{{.name}}`}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1
