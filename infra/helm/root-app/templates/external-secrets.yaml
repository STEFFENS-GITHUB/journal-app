apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: external-secrets
    spec:
      project: default
      source:
        repoURL: {{ .Values.externalSecrets.repoURL }}
        chart: {{ .Values.externalSecrets.chart }}
        targetRevision: {{ .Values.externalSecrets.version }}
        helm:
          releaseName: external-secrets
          valuesObject:
            serviceAccount:
              name: external-secrets
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            nodeSelector:
              {{- toYaml .Values.control.nodeSelector | nindent 14 }}
            tolerations:
              {{- toYaml .Values.control.tolerations | nindent 14 }}
            webhook:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              nodeSelector:
                {{- toYaml .Values.control.nodeSelector | nindent 16 }}
              tolerations:
                {{- toYaml .Values.control.tolerations | nindent 16 }}
            certController:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              nodeSelector:
                {{- toYaml .Values.control.nodeSelector | nindent 16 }}
              tolerations:
                {{- toYaml .Values.control.tolerations | nindent 16 }}
      destination:
        name: '{{`{{.name}}`}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: -1
