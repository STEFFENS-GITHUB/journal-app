apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: journal-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: journal-app
    spec:
      project: default
      source:
        repoURL: {{ .Values.journalApp.repoURL }}
        targetRevision: {{ .Values.journalApp.targetRevision }}
        path: {{ .Values.journalApp.path }}
        helm:
          valuesObject:
            ingress:
              host: '{{`{{.metadata.annotations.domain}}`}}'
            config:
              AWS_REGION: '{{`{{.metadata.annotations.region}}`}}'
              REDIS_URL: '{{`{{.metadata.annotations.redis_url}}`}}'
              EMAIL_VERIFICATION_QUEUE_URL: '{{`{{.metadata.annotations.queue_url}}`}}'
              DB_ENDPOINT: '{{`{{.metadata.annotations.db_endpoint}}`}}'
              DB_NAME: '{{`{{.metadata.annotations.db_name}}`}}'
            secrets:
              dbSecretArn: '{{`{{.metadata.annotations.db_secret_arn}}`}}'
              jwtSecretArn: '{{`{{.metadata.annotations.jwt_secret_arn}}`}}'
      destination:
        name: '{{`{{.name}}`}}'
        namespace: journal-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1
