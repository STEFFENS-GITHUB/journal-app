apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: karpenter
    spec:
      project: default
      source:
        repoURL: {{ .Values.karpenter.repoURL }}
        chart: {{ .Values.karpenter.chart }}
        targetRevision: {{ .Values.karpenter.version }}
        helm:
          releaseName: karpenter
          valuesObject:
            settings:
              clusterName: '{{`{{.metadata.annotations.cluster_name}}`}}'
              interruptionQueue: '{{`{{.metadata.annotations.karpenter_queue}}`}}'
            serviceAccount:
              name: karpenter
            nodeSelector:
              {{- toYaml .Values.control.nodeSelector | nindent 14 }}
            tolerations:
              {{- toYaml .Values.control.tolerations | nindent 14 }}
      destination:
        name: '{{`{{.name}}`}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: -1
