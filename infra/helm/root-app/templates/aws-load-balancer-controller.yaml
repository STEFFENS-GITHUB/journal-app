apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: aws-load-balancer-controller
    spec:
      project: default
      source:
        repoURL: {{ .Values.awsLoadBalancerController.repoURL }}
        chart: {{ .Values.awsLoadBalancerController.chart }}
        targetRevision: {{ .Values.awsLoadBalancerController.version }}
        helm:
          releaseName: aws-load-balancer-controller
          valuesObject:
            clusterName: '{{`{{.metadata.annotations.cluster_name}}`}}'
            region: '{{`{{.metadata.annotations.region}}`}}'
            vpcId: '{{`{{.metadata.annotations.vpc_id}}`}}'
      destination:
        name: '{{`{{.name}}`}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
