global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: journal-api
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["api:8000"]

  - job_name: redis
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: mysql
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: prometheus
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    sample_limit: 10000
    label_limit: 20
    static_configs:
      - targets: ["alloy:12345"]
