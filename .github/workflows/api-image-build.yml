name: Journal API Image Build
on:
  push:
    branches:
    - main
    paths:
    - 'api/**'
    - 'docker-compose.ci.yaml'
    - '.github/workflows/api-image-build.yml'
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6
    - name: Install python to runner
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install app dependancies
      run: pip install -r api/requirements.txt
    - name: Run unit tests
      run: pytest api/tests/unit

  integration-test:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      DEFAULT_USER: ${{ secrets.DEFAULT_USER }}
      DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      REDIS_URL: redis://localhost:6379
      SQS_ENDPOINT_URL: http://localhost:9324
      EMAIL_VERIFICATION_QUEUE_URL: http://localhost:9324/000000000000/email-verification
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6
    - name: Install python to runner
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install app dependancies
      run: pip install -r api/requirements.txt
    - name: Run docker compose
      run: docker compose -f docker-compose.ci.yaml up -d mysql elasticmq redis
    - name: Initialize journal API database
      run: python -m api.init_db
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_LOCAL }}
    - name: Run integration tests
      run: pytest api/tests/integration
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_LOCAL }}

  build-and-push:
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4
    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USER}}
        password: ${{secrets.DOCKERHUB_PAT}}
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./api
        file: ./api/Dockerfile
        push: true
        tags: |
          steffenp123/journal-api:1.${{ github.run_number }}
          steffenp123/journal-api:latest