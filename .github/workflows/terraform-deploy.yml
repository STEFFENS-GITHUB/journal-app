name: Journal Terraform Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan and apply against
        type: environment
        default: dev

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  TF_DIR: infra/terraform

permissions: # Investigate this blocks purpose with OIDC
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }} # Scopes vars only, not a gate

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.16.4

    - name: Initialize Terraform
      run: terraform -chdir=${{ env.TF_DIR }} init -backend-config=variables/${{ env.ENVIRONMENT }}.tfbackend

    - name: Terraform Validate
      run: terraform -chdir=${{ env.TF_DIR }} validate

    - name: Terraform Plan
      run: terraform -chdir=${{ env.TF_DIR }} plan -var-file=variables/${{ env.ENVIRONMENT }}.tfvars -no-color -out=tfplan

    - name: Upload plan
      uses: actions/upload-artifact@v7
      with:
        name: tfplan
        path: ${{ env.TF_DIR }}/tfplan
        retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment || 'dev' }} # Scopes vars only, not a gate

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.16.4

    - name: Download plan
      uses: actions/download-artifact@v8
      with:
        name: tfplan
        path: ${{ env.TF_DIR }}

    - name: Initialize Terraform
      run: terraform -chdir=${{ env.TF_DIR }} init -backend-config=variables/${{ env.ENVIRONMENT }}.tfbackend

    - name: Terraform Apply
      run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve tfplan
